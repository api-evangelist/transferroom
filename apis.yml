aid: transferroom
name: TransferRoom
description: >-
  TransferRoom is football's real-time transfer marketplace, connecting clubs,
  agents and players to buy, sell and loan players and to recruit head coaches.
  Its API delivers verified, real-time market intelligence — Expected Transfer
  Value (xTV) benchmarks, player availability and deal-viability signals,
  contract-expiry and estimated-salary data, agent and coach representation, and
  head-coach ratings — returned as JSON for clubs to integrate directly into
  their own systems (SQL databases, BI dashboards, spreadsheets and code
  notebooks). Trusted by 800+ clubs across 130 leagues and 500+ agencies,
  covering 130,000+ players and 7,000+ head coaches, and powering 7,500+
  transfer deals. The API is sales-gated: technical reference (endpoints,
  authentication, base URL) is provided to clubs on engagement and is not
  published publicly.
